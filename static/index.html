<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  background: #0d0d0d;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header h1 { font-size: 16px; font-weight: 600; color: #ccc; }
.header .badge {
  font-size: 11px;
  background: #2a2a2a;
  padding: 2px 8px;
  border-radius: 4px;
  color: #999;
}
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 10px;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.user-msg {
  align-self: flex-end;
  background: #2563eb;
  color: white;
  border-bottom-right-radius: 4px;
}
.bot-msg {
  align-self: flex-start;
  background: #1e1e1e;
  border: 1px solid #333;
  border-bottom-left-radius: 4px;
}
.input-area {
  border-top: 1px solid #333;
  padding: 12px 20px;
  background: #1a1a1a;
  display: flex;
  gap: 10px;
}
.input-area textarea {
  flex: 1;
  background: #0d0d0d;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px;
  color: #e0e0e0;
  font-size: 14px;
  resize: none;
  outline: none;
  min-height: 42px;
}
.input-area textarea:focus { border-color: #2563eb; }
.send-btn {
  background: #2563eb;
  border: none;
  color: white;
  border-radius: 8px;
  padding: 0 18px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}
.send-btn:hover { background: #1d4ed8; }
.send-btn:disabled { background: #333; cursor: not-allowed; }
.typing {
  align-self: flex-start;
  padding: 10px 14px;
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 10px;
  border-bottom-left-radius: 4px;
}
.typing-dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: #666;
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}
</style>
</head>
<body>
<div class="header">
  <h1>⚕ Hermes</h1>
  <span class="badge">oversoul-chat</span>
</div>
<div class="chat-area" id="chat"></div>
<div class="input-area">
  <textarea id="input" rows="1" placeholder="说点什么..." 
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button class="send-btn" id="sendBtn" onclick="send()">发送</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function addMsg(text, className) {
  const div = document.createElement('div');
  div.className = `message ${className}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMsg(text, 'user-msg');
  sendBtn.disabled = true;

  showTyping();
  try {
    const res = await fetch('/hermes-chat/api/hermes-chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    hideTyping();
    addMsg(data.reply || '(empty response)', 'bot-msg');
  } catch(e) {
    hideTyping();
    addMsg('请求失败：' + e.message, 'bot-msg');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
